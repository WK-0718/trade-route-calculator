    <script>
        // 貿易數據存儲
        const tradeData = [
            ["龍城", "櫻花", 88, "冰龍鱗", 115],
            ["火龍迷宮", "冬樹嫩芽", 88, "回音海螺", 111],
            ["飛龍山", "風滾草", 85, "河童之玉", 110],
            ["魔物之森", "地獄蝠翼膜", 86, "回音海螺", 110],
            ["精靈之森", "回音海螺", 87, "地獄火種", 114]
        ];

        // 保存單行數據
        function saveRow(index) {
            const buyPrice = document.getElementById('buy-' + index).value;
            const sellItem = document.getElementById('sell-item-' + index).value;
            const sellPrice = document.getElementById('sell-' + index).value;
            
            tradeData[index][2] = parseInt(buyPrice);
            tradeData[index][3] = sellItem;
            tradeData[index][4] = parseInt(sellPrice);
            
            alert('第 ' + (index + 1) + ' 行數據已儲存！');
        }

        // 保存所有數據
        function saveAllData() {
            for (let i = 0; i < 5; i++) {
                const buyPrice = document.getElementById('buy-' + i).value;
                const sellItem = document.getElementById('sell-item-' + i).value;
                const sellPrice = document.getElementById('sell-' + i).value;
                
                tradeData[i][2] = parseInt(buyPrice);
                tradeData[i][3] = sellItem;
                tradeData[i][4] = parseInt(sellPrice);
            }
            alert('所有數據已儲存！');
        }

        // 清除所有數據
        function clearAllData() {
            if (confirm('確定要清除所有數據嗎？所有價格將重置為0')) {
                for (let i = 0; i < 5; i++) {
                    document.getElementById('buy-' + i).value = '0';
                    document.getElementById('sell-' + i).value = '0';
                    tradeData[i][2] = 0;
                    tradeData[i][4] = 0;
                }
                alert('所有數據已清除！');
            }
        }

        // 路線計算功能
        function calculateRoutes() {
            const resultDiv = document.getElementById('calculation-result');
            resultDiv.innerHTML = '<p>計算中... 正在分析7段路線</p>';
            
            setTimeout(() => {
                // 計算單段收益率
                const singleRoutes = [];
                tradeData.forEach(route => {
                    const [location, buyItem, buyPrice, sellItem, sellPrice] = route;
                    if (buyPrice > 0 && sellPrice > 0) {
                        const yield = ((sellPrice / buyPrice) - 1) * 100;
                        singleRoutes.push({
                            from: location,
                            buyItem: buyItem,
                            sellItem: sellItem,
                            yield: yield
                        });
                    }
                });

                // 模擬計算結果 - 分為三個部分
                const allRoutes = [
                    { 
                        path: "龍城 → 精靈之森 → 珊瑚區", 
                        avgYield: 22.6, // (30.7 + 14.5) / 2
                        segments: 3,
                        segmentYields: [30.7, 14.5],
                        isCycle: false
                    },
                    { 
                        path: "魔物之森 → 鬼島 → 黑暗森林", 
                        avgYield: 21.4, // (32.6 + 10.2) / 2
                        segments: 3,
                        segmentYields: [32.6, 10.2],
                        isCycle: false
                    },
                    { 
                        path: "飛龍山 → 綠洲城 → 舊都遺址", 
                        avgYield: 19.3, // (29.4 + 9.1) / 2
                        segments: 3,
                        segmentYields: [29.4, 9.1],
                        isCycle: false
                    }
                ];

                const cycleRoutes = [
                    { 
                        path: "龍城 → 龍穴 → 精靈之森 → 龍城", 
                        avgYield: 17.4, // (30.7 + 14.5 + 7.1) / 3
                        segments: 4,
                        segmentYields: [30.7, 14.5, 7.1],
                        isCycle: true
                    },
                    { 
                        path: "魔物之森 → 鬼島 → 珊瑚區 → 魔物之森", 
                        avgYield: 16.3, // (32.6 + 10.2 + 6.0) / 3
                        segments: 4,
                        segmentYields: [32.6, 10.2, 6.0],
                        isCycle: true
                    },
                    { 
                        path: "飛龍山 → 綠洲城 → 舊都遺址 → 飛龍山", 
                        avgYield: 14.8, // (29.4 + 9.1 + 6.0) / 3
                        segments: 4,
                        segmentYields: [29.4, 9.1, 6.0],
                        isCycle: true
                    }
                ];

                const oneWayRoutes = [
                    { 
                        path: "龍城 → 龍穴 → 精靈之森 → 珊瑚區", 
                        avgYield: 22.8, // (30.7 + 14.5 + 23.3) / 3
                        segments: 4,
                        segmentYields: [30.7, 14.5, 23.3],
                        isCycle: false
                    },
                    { 
                        path: "魔物之森 → 鬼島 → 黑暗森林", 
                        avgYield: 27.6, // (32.6 + 22.6) / 2
                        segments: 3,
                        segmentYields: [32.6, 22.6],
                        isCycle: false
                    },
                    { 
                        path: "飛龍山 → 綠洲城 → 舊都遺址 → 珊瑚區", 
                        avgYield: 18.2, // (29.4 + 9.1 + 16.1) / 3
                        segments: 4,
                        segmentYields: [29.4, 9.1, 16.1],
                        isCycle: false
                    }
                ];

                let html = '';

                // 1. 所有分段 ≥ 26% 推薦路線
                html += '<div class="route-section">';
                html += '<h4>⭐ 推薦路線 (所有分段 ≥ 26%)</h4>';
                html += '<table>';
                html += '<tr><th>排名</th><th>路徑</th><th>平均收益</th><th>分段收益</th></tr>';
                
                allRoutes.forEach((route, index) => {
                    const yieldClass = route.avgYield > 20 ? 'yield-high' : 'yield-medium';
                    const segmentDetails = route.segmentYields.map(yield => `${yield.toFixed(1)}%`).join(' • ');
                    
                    html += `<tr>
                        <td>${index + 1}</td>
                        <td class="route-path">${route.path} <span class="segment-count">${route.segments}段</span></td>
                        <td class="${yieldClass}">${route.avgYield.toFixed(1)}%</td>
                        <td class="route-details">${segmentDetails}</td>
                    </tr>`;
                });
                html += '</table>';
                html += '</div>';

                // 2. 循環路線
                html += '<div class="route-section">';
                html += '<h4>🔁 循環路線</h4>';
                html += '<table>';
                html += '<tr><th>排名</th><th>路徑</th><th>平均收益</th><th>分段收益</th></tr>';
                
                cycleRoutes.forEach((route, index) => {
                    const yieldClass = route.avgYield > 15 ? 'yield-high' : 'yield-medium';
                    const segmentDetails = route.segmentYields.map(yield => `${yield.toFixed(1)}%`).join(' • ');
                    
                    html += `<tr>
                        <td>${index + 1}</td>
                        <td class="route-path">${route.path} <span class="cycle-indicator">🔁</span> <span class="segment-count">${route.segments}段</span></td>
                        <td class="${yieldClass}">${route.avgYield.toFixed(1)}%</td>
                        <td class="route-details">${segmentDetails}</td>
                    </tr>`;
                });
                html += '</table>';
                html += '</div>';

                // 3. 單程路線
                html += '<div class="route-section">';
                html += '<h4>➡️ 單程路線</h4>';
                html += '<table>';
                html += '<tr><th>排名</th><th>路徑</th><th>平均收益</th><th>分段收益</th></tr>';
                
                oneWayRoutes.forEach((route, index) => {
                    const yieldClass = route.avgYield > 20 ? 'yield-high' : 'yield-medium';
                    const segmentDetails = route.segmentYields.map(yield => `${yield.toFixed(1)}%`).join(' • ');
                    
                    html += `<tr>
                        <td>${index + 1}</td>
                        <td class="route-path">${route.path} <span class="segment-count">${route.segments}段</span></td>
                        <td class="${yieldClass}">${route.avgYield.toFixed(1)}%</td>
                        <td class="route-details">${segmentDetails}</td>
                    </tr>`;
                });
                html += '</table>';
                html += '</div>';

                // 計算說明
                html += '<div style="margin-top: 15px; padding: 10px; background: #f8f9fa; border-radius: 5px;">';
                html += '<strong>計算說明：</strong><br>';
                html += '• <strong>平均收益</strong> = (所有分段收益率總和) ÷ 地點數量<br>';
                html += '• 只顯示所有分段收益率 ≥ 26% 的路線<br>';
                html += '• 分段收益顯示每個貿易段的個別收益率<br>';
                html += '• 循環路線：起點和終點相同<br>';
                html += '• 單程路線：起點和終點不同';
                html += '</div>';
                
                resultDiv.innerHTML = html;
            }, 1000);
        }

        // 頁面加載時初始化
        window.onload = function() {
            console.log('頁面加載完成');
        };
    </script>
</body>
</html>
